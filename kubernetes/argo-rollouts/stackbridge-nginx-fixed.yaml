apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: stackbridge-flask
  namespace: default
spec:
  replicas: 5
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {duration: 10s}
      - setWeight: 50
      - pause: {duration: 10s}
      - setWeight: 100
  selector:
    matchLabels:
      app: stackbridge-flask
  template:
    metadata:
      labels:
        app: stackbridge-flask
    spec:
      containers:
      - name: stackbridge-app
        image: nginx:alpine
        ports:
        - containerPort: 80
