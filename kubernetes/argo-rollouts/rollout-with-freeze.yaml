apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: stackbridge-flask-freeze
  namespace: default
spec:
  replicas: 5
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - setWeight: 50
      - pause: {duration: 30s}
      - setWeight: 100
      analysis:
        templates:
        - templateName: freeze-check
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: stackbridge-flask-freeze
  template:
    metadata:
      labels:
        app: stackbridge-flask-freeze
    spec:
      containers:
      - name: stackbridge-app
        image: mykaelhunter/stackbridge:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_APP
          value: "app.py"
        - name: FLASK_ENV
          value: "production"
