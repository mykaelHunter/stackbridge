apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: test-canary-with-freeze
  namespace: default
spec:
  replicas: 5
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: 
          duration: 30s
      - setWeight: 50
      - pause:
          duration: 30s
      - setWeight: 100
      analysis:
        templates:
        - templateName: freeze-check
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: test-canary-with-freeze
  template:
    metadata:
      labels:
        app: test-canary-with-freeze
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
