apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: stackbridge-demo
  namespace: default
spec:
  replicas: 5
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {duration: 10s}
      - setWeight: 50
      - pause: {duration: 10s}
      - setWeight: 100
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: stackbridge-demo
  template:
    metadata:
      labels:
        app: stackbridge-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
