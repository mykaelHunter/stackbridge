apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: stackbridge-flask
  namespace: default
spec:
  replicas: 5
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - setWeight: 50
      - pause: {duration: 30s}
      - setWeight: 100
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: stackbridge-flask
  template:
    metadata:
      labels:
        app: stackbridge-flask
    spec:
      containers:
      - name: stackbridge-app
        image: mykaelhunter/stackbridge:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_APP
          value: "app.py"
        - name: FLASK_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
