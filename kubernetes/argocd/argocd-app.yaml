apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-canary-rollout
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mykaelHunter/stackbridge.git
    targetRevision: HEAD
    path: kubernetes/argo-rollouts
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
