apiVersion: v1
kind: Pod
metadata:
  name: chaos-cpu-stress
  namespace: stackbridge
spec:
  restartPolicy: Never
  containers:
  - name: stresser
    image: polinux/stress
    command: ["stress"]
    args: ["--cpu", "2", "--timeout", "60s"]
    resources:
      limits:
        cpu: "1"
        memory: "256Mi"
