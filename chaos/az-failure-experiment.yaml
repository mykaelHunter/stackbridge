apiVersion: v1
kind: Pod
metadata:
  name: chaos-az-failure
  namespace: stackbridge
spec:
  restartPolicy: Never
  containers:
  - name: chaos
    image: bitnami/kubectl:latest
    command:
    - /bin/sh
    - -c
    - |
      echo "=== AZ Failure Simulation ==="
      NODE=$(kubectl get nodes -o name | head -1)
      echo "Cordoning node: $NODE"
      kubectl cordon $NODE
      kubectl taint nodes $NODE failure=az-down:NoSchedule
      echo "Node cordoned. Checking rollout recovery..."
      sleep 30
      kubectl get rollouts -n stackbridge
      echo "Cleaning up..."
      kubectl uncordon $NODE
      kubectl taint nodes $NODE failure=az-down:NoSchedule-
      echo "AZ failure simulation complete."
