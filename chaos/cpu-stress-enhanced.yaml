apiVersion: v1
kind: Pod
metadata:
  name: chaos-cpu-stress-enhanced
  namespace: stackbridge
spec:
  restartPolicy: Never
  containers:
  - name: stresser
    image: polinux/stress
    command: ["stress"]
    args: ["--cpu", "2", "--timeout", "60s", "--vm", "1", "--vm-bytes", "128M"]
    resources:
      limits:
        cpu: "1"
        memory: "256Mi"
