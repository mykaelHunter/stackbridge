apiVersion: v1
kind: Pod
metadata:
  name: chaos-pod-kill
  namespace: stackbridge
spec:
  restartPolicy: Never
  containers:
  - name: chaos
    image: bitnami/kubectl:latest
    command:
    - /bin/sh
    - -c
    - |
      echo "=== Pod Kill Chaos ==="
      echo "Deleting pods from stackbridge-api..."
      kubectl get pods -n stackbridge -l app=stackbridge-api -o name | head -2 | xargs kubectl delete -n stackbridge
      echo "Pods deleted. Checking recovery..."
      sleep 30
      kubectl get pods -n stackbridge -l app=stackbridge-api
      echo "Pod kill complete."
