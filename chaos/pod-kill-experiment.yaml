apiVersion: v1
kind: Pod
metadata:
  name: chaos-pod-kill
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: chaos
    image: bitnami/kubectl:latest
    command:
    - /bin/sh
    - -c
    - |
      echo "Deleting 2 pods from stackbridge-demo..."
      kubectl get pods -n default -l app=stackbridge-demo -o name | head -2 | xargs kubectl delete -n default
      echo "Pods deleted. Watch recovery with: kubectl get pods -n default -w"
