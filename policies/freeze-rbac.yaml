apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-rollouts
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-rollouts-freeze
  namespace: argocd
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-rollouts-freeze
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: argo-rollouts
  namespace: default
roleRef:
  kind: Role
  name: argo-rollouts-freeze
  apiGroup: rbac.authorization.k8s.io
