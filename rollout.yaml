apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: stackbridge-api
  namespace: stackbridge
spec:
  replicas: 3
  strategy:
    canary:
      steps:
      - setWeight: 5
      - pause: {duration: 30}
      - setWeight: 25
      - pause: {duration: 30}
      - setWeight: 100
  selector:
    matchLabels:
      app: stackbridge-api
  template:
    metadata:
      labels:
        app: stackbridge-api
    spec:
      containers:
      - name: api
        image: stackbridge-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: stackbridge-secrets
              key: DB_PASS
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stackbridge-secrets
              key: SECRET_KEY
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: stackbridge-secrets
              key: STRIPE_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: stackbridge-api
  namespace: stackbridge
spec:
  selector:
    app: stackbridge-api
  ports:
  - port: 80
    targetPort: 5000
  type: ClusterIP
