name: Terraform Destroy

# Manual trigger ONLY. Never runs on push/PR.
# Destroy is irreversible — it must be a deliberate human action.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
      confirm:
        description: 'Type the environment name again to confirm (e.g. "dev")'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate-confirmation:
    name: Validate confirmation input
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation matches environment
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::Confirmation text '${{ inputs.confirm }}' does not match environment '${{ inputs.environment }}'. Aborting."
            exit 1
          fi
          echo "Confirmation matched. Proceeding with destroy of ${{ inputs.environment }}."

  terraform-destroy:
    name: Destroy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: validate-confirmation
    environment: ${{ github.event.inputs.environment }}-destroy   # see note below

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::464453620032:role/stackbridge-terraform-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Get Latest AMI
        id: ami_fetcher
        run: |
          AMI_ID=$(aws ssm get-parameter \
            --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
            --query "Parameter.Value" \
            --output text)

          if [ -z "$AMI_ID" ] || [ "$AMI_ID" == "None" ]; then
            echo "::error::Failed to resolve AMI ID — got empty or 'None'"
            exit 1
          fi

          echo "Resolved AMI: $AMI_ID"
          echo "AMI_ID=$AMI_ID" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: infra/environments/${{ github.event.inputs.environment }}
        run: terraform init -input=false

      - name: Terraform Plan (destroy)
        working-directory: infra/environments/${{ github.event.inputs.environment }}
        env:
          TF_VAR_ami_id: ${{ steps.ami_fetcher.outputs.AMI_ID }}
        run: |
          terraform plan -destroy \
            -input=false \
            -out=destroy.binary

      - name: Terraform Destroy
        working-directory: infra/environments/${{ github.event.inputs.environment }}
        env:
          TF_VAR_ami_id: ${{ steps.ami_fetcher.outputs.AMI_ID }}
        run: terraform apply -input=false destroy.binary

      - name: Post summary
        if: always()
        run: |
          echo "## Terraform Destroy Summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: \`${{ github.event.inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Status: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
