name: Terraform

on:
  push:
    branches: [main]
    paths: ["infra/environments/**"]
  pull_request:
    paths: ["infra/environments/**"]

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::464453620032:role/stackbridge-terraform-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Conftest
        run: |
          curl -Lo conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.46.0/conftest_0.46.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz && mv conftest /usr/local/bin/

      - name: Terraform Init
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: Get Latest AMI
        id: ami_fetcher
        run: |
          AMI_ID=$(aws ec2 describe-images --filters "Name=name,Values=my-app-*" --query "Images[0].ImageId" --output text)
          echo "AMI_ID=$AMI_ID" >> $GITHUB_OUTPUT

      - name: Terraform Plan
        working-directory: infra/environments/${{ matrix.environment }}
        env:
          TF_VAR_ami_id: ${{ steps.ami_fetcher.outputs.AMI_ID }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan.binary

      - name: OPA Policy Check
        working-directory: infra/environments/${{ matrix.environment }}
        run: |
          terraform show -json tfplan.binary > tfplan.json
          conftest test tfplan.json --policy ../../policies/

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform apply -input=false tfplan.binary
