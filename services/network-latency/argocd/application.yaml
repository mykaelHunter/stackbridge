apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: network-latency

spec:

  project: default

  source:

    repoURL: https://github.com/mykaelHunter/stackbridge.git

    targetRevision: HEAD

    path: services/network-latency/helm

  destination:

    server: https://kubernetes.default.svc

    namespace: {{NAMESPACE}}

  syncPolicy:

    automated:

      prune: true

      selfHeal: true
