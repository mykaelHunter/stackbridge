# Chaos Experiment 1: Pod Kill — Self-Healing / AZ Failure
# ==========================================================
# Hypothesis: If pods in az-failure are killed, the rollout
# controller recreates them within 30 seconds and the service
# remains available throughout.
#
# Run:   kubectl apply -f chaos/pod-kill.yaml
# Watch: kubectl get pods -l app=az-failure -w
# Clean: kubectl delete -f chaos/pod-kill.yaml
apiVersion: v1
kind: Pod
metadata:
  name: az-failure-pod-kill
  namespace: {{NAMESPACE}}
  labels:
    app: chaos
    experiment: pod-kill
    target-service: az-failure
    managed-by: stackbridge-idp
spec:
  restartPolicy: Never
  serviceAccountName: chaos-sa
  containers:
    - name: chaos
      image: bitnami/kubectl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "=== Pod Kill Chaos — az-failure ==="
          echo "Deleting pods from az-failure..."
          kubectl get pods -n {{NAMESPACE}} -l app=az-failure -o name \
            | head -2 | xargs kubectl delete -n {{NAMESPACE}}
          echo "Pods deleted. Watching recovery..."
          sleep 30
          kubectl get pods -n {{NAMESPACE}} -l app=az-failure
          echo "Pod kill experiment complete."
