apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: stackbridge-db-secret
  namespace: dev

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: stackbridge-secret-store
    kind: SecretStore

  target:
    name: stackbridge-db-secret
    creationPolicy: Owner

  # Remote key matches aws_secretsmanager_secret.db_password.name in
  # modules/database/main.tf ("stackbridge/${environment}/db-password").
  # `property` pulls a single field out of that secret's JSON body
  # (written by aws_secretsmanager_secret_version.db_password —
  # username/password/host/port/dbname).
  data:
  - secretKey: DB_PASS
    remoteRef:
      key: stackbridge/dev/db-password
      property: password
  - secretKey: DB_HOST
    remoteRef:
      key: stackbridge/dev/db-password
      property: host
  - secretKey: DB_PORT
    remoteRef:
      key: stackbridge/dev/db-password
      property: port
  - secretKey: DB_USER
    remoteRef:
      key: stackbridge/dev/db-password
      property: username
  - secretKey: DB_NAME
    remoteRef:
      key: stackbridge/dev/db-password
      property: dbname
