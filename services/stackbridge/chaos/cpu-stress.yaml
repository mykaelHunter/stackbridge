# Chaos Experiment 2: CPU Stress — Resource Exhaustion
# =====================================================
# Hypothesis: If CPU saturates to 100%, the system alerts before
# user impact occurs and stackbridge remains schedulable.
#
# Run:   kubectl apply -f chaos/cpu-stress.yaml
# Watch: kubectl top pods && kubectl get events --sort-by=.lastTimestamp
# Clean: kubectl delete -f chaos/cpu-stress.yaml
apiVersion: v1
kind: Pod
metadata:
  name: stackbridge-cpu-stress
  namespace: {{NAMESPACE}}
  labels:
    app: chaos
    experiment: cpu-stress
    target-service: stackbridge
    managed-by: stackbridge-idp
spec:
  restartPolicy: Never
  containers:
    - name: stresser
      image: polinux/stress
      command: ["stress"]
      args: ["--cpu", "2", "--timeout", "60s", "--vm", "1", "--vm-bytes", "128M"]
      resources:
        requests:
          cpu: "500m"
          memory: "64Mi"
        limits:
          cpu: "1"
          memory: "256Mi"
