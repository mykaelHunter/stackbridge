# Chaos Experiment 1: Pod Kill — Self-Healing / AZ Failure
# ==========================================================
# Hypothesis: If pods in stress are killed, the rollout
# controller recreates them within 30 seconds and the service
# remains available throughout.
#
# Run:   kubectl apply -f chaos/pod-kill.yaml
# Watch: kubectl get pods -l app=stress -w
# Clean: kubectl delete -f chaos/pod-kill.yaml
apiVersion: v1
kind: Pod
metadata:
  name: stress-pod-kill
  namespace: {{NAMESPACE}}
  labels:
    app: chaos
    experiment: pod-kill
    target-service: stress
    managed-by: stackbridge-idp
spec:
  restartPolicy: Never
  serviceAccountName: chaos-sa
  containers:
    - name: chaos
      image: bitnami/kubectl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "=== Pod Kill Chaos — stress ==="
          echo "Deleting pods from stress..."
          kubectl get pods -n stackbridge -l app=stress -o name \
            | head -2 | xargs kubectl delete -n stackbridge
          echo "Pods deleted. Watching recovery..."
          sleep 30
          kubectl get pods -n stackbridge -l app=stress
          echo "Pod kill experiment complete."
